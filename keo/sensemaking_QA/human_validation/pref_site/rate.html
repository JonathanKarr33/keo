<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>KEO · Rate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="page-rate">
  <header class="site-header dark">
    <a class="brand" href="index.html">KEO</a>
    <nav>
      <a href="index.html">Sign in</a>
      <a href="rate.html" aria-current="page">Prefs</a>
      <a href="severity.html">Severity</a>
      <a href="adjudicate.html">Adjudicate</a>
      <a href="status.html">Status</a>
    </nav>
    <div class="header-right">
      <span id="who-label" class="pill"></span>
      <span id="progress-label" class="progress-text">0 / 40</span>
      <span id="save-flash" class="flash" hidden></span>
      <button type="button" id="btn-logout" class="ghost">Log out</button>
    </div>
  </header>
  <div class="progress"><span id="progress-bar"></span></div>

  <div class="toolbar">
    <div class="legend" aria-label="Highlight key">
      <span class="legend-title">Key</span>
      <span class="leg"><mark class="chg">aa</mark> changed</span>
      <span class="leg"><mark class="only-a">aa</mark> only A</span>
      <span class="leg"><mark class="only-b">aa</mark> only B</span>
    </div>
    <div class="toolbar-right">
      <label class="toggle"><input type="checkbox" id="sync-scroll" checked/> Sync scroll</label>
      <span class="kbd-hint"><kbd>←</kbd><kbd>→</kbd> navigate · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> vote</span>
    </div>
  </div>

  <div id="dots" class="dots" aria-label="Progress by item"></div>

  <main class="stage">
    <div class="nav-row">
      <button type="button" id="btn-prev" class="navbtn">← Prev</button>
      <div class="jump-wrap">
        <span id="item-meta" class="item-meta"></span>
        <span id="item-status" class="status-inline">unrated</span>
      </div>
      <button type="button" id="btn-next" class="navbtn">Next →</button>
    </div>

    <article id="card" class="card">
      <h1 id="question"></h1>
      <div class="diffbar">
        <div class="diff-a"><strong>In A more:</strong> <span id="chips-a"></span></div>
        <div class="diff-b"><strong>In B more:</strong> <span id="chips-b"></span></div>
      </div>
      <div class="pair">
        <section class="ans a">
          <h2>Answer A</h2>
          <div id="body-a" class="body"></div>
        </section>
        <section class="ans b">
          <h2>Answer B</h2>
          <div id="body-b" class="body"></div>
        </section>
      </div>
    </article>
  </main>

  <footer class="vote-bar">
    <p id="order-note" class="order-note"></p>
    <div class="vote" role="group" aria-label="preference">
      <button type="button" data-pref="A" id="vote-a"><span class="v-k">1</span> Prefer A</button>
      <button type="button" data-pref="neither" id="vote-neither"><span class="v-k">2</span> Neither</button>
      <button type="button" data-pref="B" id="vote-b"><span class="v-k">3</span> Prefer B</button>
    </div>
    <label class="auto-next">
      <input type="checkbox" id="auto-next" checked/>
      Advance to next unrated after save
    </label>
  </footer>

  <div id="done-overlay" class="done-overlay" hidden>
    <div class="done-card">
      <p class="eyebrow">All done</p>
      <h2>40 / 40 rated</h2>
      <p>Your preferences are saved on disk. You can still revisit any item.</p>
      <div class="done-actions">
        <a class="btn-primary" href="status.html">View status</a>
        <button type="button" class="btn-secondary" id="btn-review">Review from item 1</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="rate.js"></script>
</body>
</html>
